server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Старые адреса сайта на Tilda (301 — постоянный переезд)
    location ~ ^/page93041346(\.html)?/?$ { return 301 /home; }
    location ~ ^/priva/?$ { return 301 /privacy-policy; }
    location ~ ^/(podval|page74570317|page203094009|page161964109|page161968009)(\.html)?/?$ {
        return 301 /;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Файлы сборки с хешем в имени — кешируем навсегда
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Картинки и шрифты без хеша — на 30 дней
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
